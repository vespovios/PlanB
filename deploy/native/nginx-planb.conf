# PlanB behind an existing nginx: copy to /etc/nginx/sites-available/planb, set server_name,
# link into sites-enabled, then run `sudo certbot --nginx -d <domain> --redirect` to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name planb.example.com;

    # Image uploads (10 MiB) arrive as multipart; MCP uploads arrive base64-encoded.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Live updates use server-sent events: never buffer, allow long-lived streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
